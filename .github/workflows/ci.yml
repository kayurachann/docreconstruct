name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  static-contracts:
    name: Static, schema, package, and build contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install -e ".[all,dev]"

      - name: Check lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Check types
        run: python -m mypy src/docreconstruct tools/ci

      - name: Validate JSON Schema dialects and runtime compatibility
        run: python tools/ci/validate_json_schemas.py

      - name: Validate committed DOCX packages
        run: python tools/ci/validate_docx_packages.py docs/showcases

      - name: Build source and wheel distributions
        run: python -m build

  full-tests:
    name: Full unit, adversarial, and property suite (Ubuntu / Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install -e ".[all,dev]"

      - name: Run the complete failure-sensitive test suite with branch coverage
        run: >-
          python -m pytest -q
          --cov=docreconstruct
          --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=json:build/coverage.json

      - name: Enforce scope-specific coverage ratchets
        run: python tools/ci/check_coverage.py build/coverage.json

  dependency-audit:
    name: Known-vulnerability audit of the runtime dependency set
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The runner image ships its own build tooling, and that tooling lands in
      # the environment the audit sees. Update it first so the job reports on
      # this project's dependencies rather than on the image's age.
      - name: Update build tooling
        run: python -m pip install --upgrade pip setuptools wheel

      # Only what actually ships and reads untrusted documents; the development
      # extra is deliberately excluded so a tooling advisory cannot block a fix.
      - name: Install the runtime dependency set
        run: python -m pip install -e ".[all]"

      - name: Install pip-audit
        run: python -m pip install "pip-audit>=2.7,<3"

      # Fails the build on a known-vulnerable dependency. When an advisory has no
      # fix available yet, add `--ignore-vuln <ID>` here with a comment saying why.
      - name: Audit installed dependencies against the advisory database
        run: python -m pip_audit --skip-editable --progress-spinner off

  compatibility-smoke:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu / Python 3.11 smoke
            os: ubuntu-24.04
            python-version: "3.11"
          - label: Ubuntu / Python 3.12 smoke
            os: ubuntu-24.04
            python-version: "3.12"
          - label: Ubuntu / Python 3.13 smoke
            os: ubuntu-24.04
            python-version: "3.13"
          - label: Windows / Python 3.11 smoke
            os: windows-2022
            python-version: "3.11"
          - label: macOS / Python 3.11 smoke
            os: macos-14
            python-version: "3.11"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install -e ".[all,dev]"

      - name: Verify the resolved dependency graph
        run: python -m pip check

      - name: Exercise portable IR, pipeline, evaluator, and DOCX contracts
        run: >-
          python -m pytest -q
          tests/test_ir.py
          tests/test_pipeline_integration.py
          tests/test_renderers.py
          tests/test_evaluation_quality_contract.py

      - name: Validate DOCX package portability
        run: python tools/ci/validate_docx_packages.py docs/showcases

  showcase-reproduce:
    name: Showcases rebuild from their committed inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[all]"

      - name: Rebuild every showcase and diff against the lock
        run: python scripts/reproduce_showcases.py

  docker-full-image:
    name: Self-contained server image builds and answers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build the full image (API + Tesseract + LibreOffice)
        run: docker build --target full -t docreconstruct-full .

      - name: Boot the server and require a healthy answer
        run: |
          docker run -d --name dr -p 8000:8000 docreconstruct-full
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:8000/health; then
            echo '--- container state ---'
            docker ps -a
            echo '--- container logs ---'
            docker logs dr
            exit 7
          fi
          curl -fsS http://127.0.0.1:8000/v1/hybrid/capabilities | tee capabilities.json
          python - <<'PY'
          import json
          payload = json.load(open("capabilities.json"))
          offered = {row["name"]: row for row in payload["hosted_ocr_providers"]}
          assert payload["server_generates_json"] is True, payload
          assert offered["tesseract_local"]["available"] is True, offered
          print("full image offers free server-side OCR")
          PY

      - name: Exercise one real reconstruction through the container
        run: |
          python -c "from PIL import Image; Image.new('RGB',(200,120),'white').save('probe.png')" || python -m pip install pillow && python -c "from PIL import Image; Image.new('RGB',(200,120),'white').save('probe.png')"
          curl -fsS -o out.docx -F "file=@probe.png;type=image/png" -F 'options={"output_format":"docx"}' http://127.0.0.1:8000/v1/reconstruct
          python - <<'PY'
          data = open("out.docx","rb").read()
          assert data[:2] == b"PK", data[:20]
          print(f"reconstruct over HTTP returned a DOCX ({len(data)} bytes)")
          PY
          docker logs dr --tail 5
