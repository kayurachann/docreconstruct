[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docreconstruct"
version = "0.1.0"
description = "Model-agnostic document reconstruction from PDFs and images to editable structure"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "docreconstruct contributors" }]
maintainers = [
  { name = "Kayura~Chan", email = "272149049+kayurachann@users.noreply.github.com" },
]
keywords = [
  "document-ai",
  "document-reconstruction",
  "layout-analysis",
  "ocr",
  "pdf",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: General",
]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "Pillow>=12.3,<13",
  # Compiled exact Levenshtein for the evaluator; metrics.py keeps a
  # dependency-free Myers fallback for installs without a wheel.
  "rapidfuzz>=3.9,<4",
]

[project.urls]
Homepage = "https://github.com/kayurachann/docreconstruct"
Repository = "https://github.com/kayurachann/docreconstruct.git"
Issues = "https://github.com/kayurachann/docreconstruct/issues"
Documentation = "https://github.com/kayurachann/docreconstruct#readme"

[project.optional-dependencies]
pdf = [
  "PyMuPDF>=1.24,<2",
]
docx = [
  "python-docx>=1.1,<2",
]
hybrid = [
  "numpy>=1.26,<3",
  "PyMuPDF>=1.24,<2",
  "pypdf>=6.15,<7",
  "python-docx>=1.1,<2",
]
api = [
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.31,<1",
]
dev = [
  "build>=1.2,<2",
  "fastapi>=0.111,<1",
  "hypothesis>=6.112,<7",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "python-multipart>=0.0.31,<1",
  "ruff>=0.5,<1",
  "types-jsonschema>=4.23,<5",
]
all = [
  "PyMuPDF>=1.24,<2",
  "numpy>=1.26,<3",
  "pypdf>=6.15,<7",
  "python-docx>=1.1,<2",
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.31,<1",
]

[project.scripts]
docreconstruct = "docreconstruct.cli:app"
docreconstruct-api = "docreconstruct.api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["docreconstruct"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "build-check", "dist", "output", "src/docreconstruct.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/docreconstruct/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "pypdf", "pypdf.*"]
ignore_missing_imports = true
