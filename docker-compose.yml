services:
  api:
    build:
      context: .
      # `full` bundles Tesseract (vie/eng/chi_sim) and LibreOffice so the
      # compose deployment is self-contained: server-side OCR evidence and
      # render QA work with no cloud credential. Use `--target runtime` for
      # the slim API-only image.
      target: full
      args:
        DOCRECONSTRUCT_EXTRAS: api,pdf,docx
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DOCRECONSTRUCT_MAX_UPLOAD_MB: "50"
    volumes:
      - ./data:/data
    tmpfs:
      - /tmp:size=512m,mode=1777
    restart: unless-stopped
